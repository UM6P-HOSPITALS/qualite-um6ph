services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: qualite-um6ph
      POSTGRES_PASSWORD: qualite-um6ph
      POSTGRES_DB: qualite-um6ph
    ports:
      - "5432:5432"
    volumes:
      - qualite-um6ph_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  qualite-um6ph_postgres_data:
